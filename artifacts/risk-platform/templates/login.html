<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Risk Intelligence Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeInUp .4s ease both; }
    input:focus { outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,.3); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md fade-in">
  <!-- Logo / Brand -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 text-white font-bold text-xl mb-4 shadow-lg shadow-blue-200">AI</div>
    <h1 class="text-2xl font-bold text-slate-800">Risk Intelligence</h1>
    <p class="text-slate-500 text-sm mt-1">Governance Platform</p>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
    <h2 class="text-lg font-bold text-slate-800 mb-1">Sign in to your account</h2>
    <p class="text-sm text-slate-500 mb-6">Enter your credentials to access the platform.</p>

    {% if error %}
    <div class="flex items-center gap-2 mb-5 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5" for="username">Username</label>
        <input
          id="username" name="username" type="text" required autocomplete="username"
          placeholder="Enter your username"
          class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm transition-all bg-white text-slate-800 placeholder-slate-400"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5" for="password">Password</label>
        <div class="relative">
          <input
            id="password" name="password" type="password" required autocomplete="current-password"
            placeholder="Enter your password"
            class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm transition-all bg-white text-slate-800 placeholder-slate-400 pr-10"
          />
          <button type="button" onclick="togglePwd()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
      </div>
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors mt-2 flex items-center justify-center gap-2"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
        Sign In
      </button>
    </form>
  </div>

  <div class="mt-4 px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-center">
    <p class="text-xs text-slate-400 mb-1 font-medium uppercase tracking-wider">Demo Credentials</p>
    <p class="text-sm font-mono text-slate-200">
      <span class="text-slate-400">Username:</span> <strong>admin</strong>
      &nbsp;&nbsp;
      <span class="text-slate-400">Password:</span> <strong>admin123</strong>
    </p>
  </div>
  <p class="text-center text-xs text-slate-400 mt-4">v2.1.0 &mdash; Flask Edition &mdash; AI-Driven Risk Governance</p>
</div>

<script>
function togglePwd() {
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
